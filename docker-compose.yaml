name: bookorbit-mcp

services:
  bookorbit-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BOOKORBIT_BASE_URL: ${BOOKORBIT_BASE_URL:?Set BOOKORBIT_BASE_URL}
      BOOKORBIT_REFRESH_TOKEN: ${BOOKORBIT_REFRESH_TOKEN:-}
      PORT: "3000"
      HISTORY_PATH: /data/bookorbit-history.sqlite
    expose:
      - "3000"
    volumes:
      - bookorbit-history:/data
    networks:
      mcp:
        aliases:
          - bookorbit-mcp

volumes:
  bookorbit-history:

networks:
  mcp:
    name: ${MCP_NETWORK_NAME:-mcp}
    external: true
